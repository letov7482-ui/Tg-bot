<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Крестики-нолики на 4 игрока</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1e1e2f 0%, #2d2d44 100%);
    color: #fff;
    padding: 20px;
  }

  .container {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    max-width: 600px;
    width: 100%;
    text-align: center;
  }

  h1 {
    font-size: 26px;
    margin-bottom: 8px;
    background: linear-gradient(90deg, #ff4d6d, #4d9bff, #4dff88, #ffd24d);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subtitle {
    font-size: 13px;
    color: #aaa;
    margin-bottom: 20px;
  }

  /* Список игроков */
  .players {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 20px;
  }

  .player {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.05);
    border: 2px solid transparent;
    transition: all 0.3s ease;
    font-size: 14px;
    font-weight: 600;
  }

  .player.active {
    transform: scale(1.05);
    box-shadow: 0 0 20px currentColor;
    border-color: currentColor;
  }

  .player.winner {
    animation: pulse 0.8s infinite alternate;
  }

  @keyframes pulse {
    from { box-shadow: 0 0 10px currentColor; }
    to   { box-shadow: 0 0 30px currentColor, 0 0 50px currentColor; }
  }

  .dot {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    flex-shrink: 0;
    box-shadow: 0 0 10px currentColor;
  }

  .p1 { color: #ff4d6d; } .p1 .dot { background: #ff4d6d; }
  .p2 { color: #4d9bff; } .p2 .dot { background: #4d9bff; }
  .p3 { color: #4dff88; } .p3 .dot { background: #4dff88; }
  .p4 { color: #ffd24d; } .p4 .dot { background: #ffd24d; }

  /* Поле */
  .board {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    margin: 0 auto 20px;
    max-width: 420px;
  }

  .cell {
    aspect-ratio: 1;
    background: rgba(255, 255, 255, 0.06);
    border: 2px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  .cell:hover:not(.taken) {
    background: rgba(255, 255, 255, 0.12);
    transform: translateY(-2px);
  }

  .cell.taken { cursor: not-allowed; }

  .mark {
    width: 60%;
    height: 60%;
    border-radius: 50%;
    animation: pop 0.3s ease;
  }

  @keyframes pop {
    0%   { transform: scale(0); opacity: 0; }
    70%  { transform: scale(1.2); }
    100% { transform: scale(1); opacity: 1; }
  }

  .cell .mark.m1 { background: #ff4d6d; box-shadow: 0 0 20px #ff4d6d; }
  .cell .mark.m2 { background: #4d9bff; box-shadow: 0 0 20px #4d9bff; }
  .cell .mark.m3 { background: #4dff88; box-shadow: 0 0 20px #4dff88; }
  .cell .mark.m4 { background: #ffd24d; box-shadow: 0 0 20px #ffd24d; }

  .cell.win {
    background: rgba(255, 255, 255, 0.2);
    animation: winFlash 0.6s infinite alternate;
  }

  @keyframes winFlash {
    from { transform: scale(1); }
    to   { transform: scale(1.08); }
  }

  /* Статус */
  .status {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 16px;
    min-height: 24px;
  }

  /* Кнопки */
  .btn {
    padding: 12px 28px;
    font-size: 15px;
    font-weight: 700;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    background: linear-gradient(135deg, #6a4dff, #4d9bff);
    color: #fff;
    transition: all 0.2s ease;
    box-shadow: 0 4px 20px rgba(106, 77, 255, 0.4);
  }

  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 25px rgba(106, 77, 255, 0.6);
  }

  .btn:active { transform: translateY(0); }

  /* Оверлей */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.75);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }

  .overlay.show { display: flex; }

  .overlay-content {
    background: #1e1e2f;
    padding: 40px;
    border-radius: 20px;
    text-align: center;
    max-width: 400px;
    animation: pop 0.4s ease;
    border: 2px solid rgba(255, 255, 255, 0.1);
  }

  .overlay-content h2 {
    font-size: 28px;
    margin-bottom: 12px;
  }

  .overlay-content p {
    color: #aaa;
    margin-bottom: 24px;
  }

  @media (max-width: 500px) {
    .container { padding: 20px; }
    h1 { font-size: 20px; }
    .players { grid-template-columns: 1fr; }
    .player { font-size: 13px; padding: 8px 12px; }
  }
</style>
</head>
<body>

<div class="container">
  <h1>Крестики-нолики на 4 игрока</h1>
  <p class="subtitle">Поле 5×5 · Собери 4 в ряд по горизонтали, вертикали или диагонали</p>

  <div class="players">
    <div class="player p1" id="player1"><div class="dot"></div>Красный</div>
    <div class="player p2" id="player2"><div class="dot"></div>Синий</div>
    <div class="player p3" id="player3"><div class="dot"></div>Зелёный</div>
    <div class="player p4" id="player4"><div class="dot"></div>Жёлтый</div>
  </div>

  <div class="status" id="status">Ход: 🔴 Красный</div>

  <div class="board" id="board"></div>

  <button class="btn" onclick="resetGame()">🔄 Новая игра</button>
</div>

<div class="overlay" id="overlay">
  <div class="overlay-content">
    <h2 id="overlayTitle">Победа!</h2>
    <p id="overlayText"></p>
    <button class="btn" onclick="resetGame()">🔄 Играть снова</button>
  </div>
</div>

<script>
  const SIZE = 5;
  const WIN_LENGTH = 4;

  const COLORS = {
    1: { name: 'Красный', hex: '#ff4d6d', emoji: '🔴' },
    2: { name: 'Синий',   hex: '#4d9bff', emoji: '🔵' },
    3: { name: 'Зелёный', hex: '#4dff88', emoji: '🟢' },
    4: { name: 'Жёлтый',  hex: '#ffd24d', emoji: '🟡' },
  };

  let board = [];
  let currentPlayer = 1;
  let finished = false;
  let boardEl;
  let statusEl;
  let overlayEl;
  let overlayTitleEl;
  let overlayTextEl;
  let playerEls = {};

  function initGame() {
    boardEl = document.getElementById('board');
    statusEl = document.getElementById('status');
    overlayEl = document.getElementById('overlay');
    overlayTitleEl = document.getElementById('overlayTitle');
    overlayTextEl = document.getElementById('overlayText');

    playerEls = {
      1: document.getElementById('player1'),
      2: document.getElementById('player2'),
      3: document.getElementById('player3'),
      4: document.getElementById('player4'),
    };

    resetGame();
  }

  function resetGame() {
    board = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
    currentPlayer = 1;
    finished = false;

    overlayEl.classList.remove('show');
    Object.values(playerEls).forEach(el => el.classList.remove('active', 'winner'));

    renderBoard();
    updateStatus();
  }

  function renderBoard() {
    boardEl.innerHTML = '';

    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.row = r;
        cell.dataset.col = c;

        const val = board[r][c];
        if (val !== 0) {
          cell.classList.add('taken');
          const mark = document.createElement('div');
          mark.className = `mark m${val}`;
          cell.appendChild(mark);
        }

        cell.addEventListener('click', () => handleClick(r, c));
        boardEl.appendChild(cell);
      }
    }
  }

  function handleClick(row, col) {
    if (finished) return;
    if (board[row][col] !== 0) return;

    board[row][col] = currentPlayer;

    const cell = boardEl.querySelector(`[data-row="${row}"][data-col="${col}"]`);
    cell.classList.add('taken');
    const mark = document.createElement('div');
    mark.className = `mark m${currentPlayer}`;
    cell.appendChild(mark);

    const winCells = checkWin(row, col, currentPlayer);
    if (winCells) {
      finished = true;
      winCells.forEach(([r, c]) => {
        const cellEl = boardEl.querySelector(`[data-row="${r}"][data-col="${c}"]`);
        cellEl.classList.add('win');
      });
      showWinner(currentPlayer);
      return;
    }

    if (board.flat().every(v => v !== 0)) {
      finished = true;
      showDraw();
      return;
    }

    currentPlayer = currentPlayer % 4 + 1;
    updateStatus();
  }

  function checkWin(row, col, player) {
    const directions = [
      [0, 1],   // горизонталь
      [1, 0],   // вертикаль
      [1, 1],   // диагональ ↘
      [1, -1],  // диагональ ↙
    ];

    for (const [dr, dc] of directions) {
      const cells = [[row, col]];

      // В одну сторону
      let r = row + dr, c = col + dc;
      while (inBounds(r, c) && board[r][c] === player) {
        cells.push([r, c]);
        r += dr; c += dc;
      }

      // В другую сторону
      r = row - dr; c = col - dc;
      while (inBounds(r, c) && board[r][c] === player) {
        cells.push([r, c]);
        r -= dr; c -= dc;
      }

      if (cells.length >= WIN_LENGTH) return cells;
    }

    return null;
  }

  function inBounds(r, c) {
    return r >= 0 && r < SIZE && c >= 0 && c < SIZE;
  }

  function updateStatus() {
    const p = COLORS[currentPlayer];
    statusEl.innerHTML = `Ход: ${p.emoji} <span style="color:${p.hex}">${p.name}</span>`;

    Object.entries(playerEls).forEach(([num, el]) => {
      el.classList.toggle('active', Number(num) === currentPlayer);
    });
  }

  function showWinner(player) {
    const p = COLORS[player];
    statusEl.innerHTML = `🏆 Победил ${p.emoji} <span style="color:${p.hex}">${p.name}</span>!`;

    playerEls[player].classList.add('winner');
    Object.values(playerEls).forEach(el => el.classList.remove('active'));

    overlayTitleEl.textContent = '🏆 Победа!';
    overlayTitleEl.style.color = p.hex;
    overlayTextEl.textContent = `${p.emoji} ${p.name} собрал 4 в ряд!`;

    setTimeout(() => overlayEl.classList.add('show'), 600);
  }

  function showDraw() {
    statusEl.textContent = '🤝 Ничья!';
    Object.values(playerEls).forEach(el => el.classList.remove('active'));

    overlayTitleEl.textContent = '🤝 Ничья!';
    overlayTitleEl.style.color = '#fff';
    overlayTextEl.textContent = 'Поле заполнено, победителя нет.';

    setTimeout(() => overlayEl.classList.add('show'), 600);
  }

  // Запуск
  initGame();
</script>

</body>
</html>
