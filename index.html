<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Hamster</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: radial-gradient(circle at top, #1a1e2e, #0b0e14);
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Верхняя панель */
        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 20px;
            background: rgba(20,25,35,0.95);
            border-bottom: 1px solid #2a3142;
        }
        .user-info { display: flex; align-items: center; gap: 12px; }
        .avatar {
            width: 48px; height: 48px; border-radius: 14px;
            background: linear-gradient(145deg, #2b3040, #1a1e2a);
            border: 2px solid #4caf50;
            display: flex; align-items: center; justify-content: center;
            font-size: 28px;
        }
        .user-name { font-weight: 800; font-size: 16px; }
        .user-level { font-size: 12px; color: #8b93a7; }
        .profit {
            background: #1e2532; padding: 8px 14px; border-radius: 20px;
            font-size: 13px; font-weight: 700; color: #ffd700;
            border: 1px solid rgba(255,215,0,0.3);
        }

        /* Карточки меню */
        .menu-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
            padding: 16px 20px;
        }
        .menu-card {
            background: #161b26; border: 1px solid #2a3142; border-radius: 16px;
            padding: 16px 8px; text-align: center;
            cursor: pointer; transition: transform 0.2s;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }
        .menu-card:hover { transform: translateY(-4px); }
        .menu-card .icon { font-size: 36px; margin-bottom: 8px; }
        .menu-card .title { font-size: 13px; color: #b0b8c8; margin-bottom: 6px; }
        .menu-card .timer { font-size: 12px; color: #687080; }

        /* Центральная зона */
        .main-zone {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            position: relative; padding: 20px;
        }
        .coin-display {
            display: flex; align-items: center; gap: 12px;
            font-size: 44px; font-weight: 900;
            color: #ffd700; text-shadow: 0 0 30px rgba(255,215,0,0.6);
            margin-bottom: 20px;
        }
        .coin-icon {
            width: 50px; height: 50px; border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ffe082, #ffb300);
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; color: #5d4037;
        }

        /* Кольцо с хомяком */
        .hamster-ring {
            width: 300px; height: 300px; border-radius: 50%;
            background: #12121a; padding: 8px;
            box-shadow: 0 0 60px rgba(33,150,243,0.6), inset 0 0 30px rgba(33,150,243,0.3);
            position: relative; cursor: pointer;
        }
        .hamster-ring::before {
            content: ''; position: absolute; inset: -8px; border-radius: 50%;
            background: conic-gradient(#2196f3, #1976d2, #2196f3);
            animation: rotateRing 4s linear infinite; z-index: -1;
        }
        .hamster-ring::after {
            content: ''; position: absolute; inset: 8px; border-radius: 50%;
            background: #0e1116; z-index: 0;
        }
        @keyframes rotateRing { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .hamster { width: 270px; height: 270px; animation: breathe 3s ease-in-out infinite; }
        @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.02); } }

        /* Нижняя панель */
        .bottom-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 20px; background: rgba(20,25,35,0.95);
            border-top: 1px solid #2a3142;
        }
        .energy { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 700; color: #ffd700; }
        .energy-bar { width: 160px; height: 12px; background: #2a2e3a; border-radius: 10px; overflow: hidden; }
        .energy-fill { height: 100%; background: linear-gradient(90deg, #ff8f00, #ffd700); }
        .boost {
            background: linear-gradient(145deg, #2196f3, #1976d2);
            padding: 12px 24px; border-radius: 30px; font-weight: 800; color: #fff;
            cursor: pointer; transition: transform 0.2s;
        }
        .boost:hover { transform: scale(1.05); }

        /* Модальные окна */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); justify-content: center; align-items: center;
            z-index: 200;
        }
        .modal-content {
            background: #161b26; padding: 24px; border-radius: 24px;
            width: 92%; max-width: 420px; max-height: 85vh; overflow-y: auto;
            border: 1px solid #2a3142;
        }
        .modal-content h3 { color: #ffd700; margin-bottom: 20px; }
        .close { position: absolute; top: 16px; right: 20px; font-size: 28px; cursor: pointer; }
        .item { background: #1e2532; padding: 12px; margin: 10px 0; border-radius: 14px; display: flex; justify-content: space-between; align-items: center; }
        .item button { background: #ffd700; border: none; padding: 8px 16px; border-radius: 10px; cursor: pointer; font-weight: 800; }
        .slot-machine { font-size: 52px; text-align: center; margin: 24px 0; letter-spacing: 15px; }
        .result { text-align: center; font-size: 18px; margin: 16px 0; font-weight: 700; }
        .mission { display: flex; justify-content: space-between; margin: 16px 0; align-items: center; }
        .mission button { background: #ffd700; border: none; padding: 8px 16px; border-radius: 10px; cursor: pointer; }

        /* Анимации */
        .floating-text { position: absolute; font-size: 28px; font-weight: 900; color: #ffd700; animation: floatUp 0.8s forwards; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-120px); } }
        .particle { position: absolute; width: 8px; height: 8px; background: #ffd700; border-radius: 50%; animation: particleFly 0.8s forwards; }
        @keyframes particleFly { 0% { opacity: 1; transform: translate(0,0); } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)); } }
        #offline-reward { display: none; position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #4caf50; padding: 12px 24px; border-radius: 30px; z-index: 999; }
    </style>
</head>
<body>
    <div id="offline-reward"></div>

    <!-- Верхняя панель -->
    <div class="top-bar">
        <div class="user-info">
            <div class="avatar" id="avatar">🐹</div>
            <div>
                <div class="user-name">CEO (Ты)</div>
                <div class="user-level">Grandmaster > 9 / 11</div>
            </div>
        </div>
        <div class="profit">💎 <span id="profit">+0</span> / час</div>
        <div class="settings">⚙️</div>
    </div>

    <!-- Карточки меню -->
    <div class="menu-grid">
        <div class="menu-card" onclick="openWheel()">
            <div class="icon">🎡</div>
            <div class="title">Колесо</div>
            <div class="timer" id="wheelTimer">24:00</div>
        </div>
        <div class="menu-card" onclick="openMissions()">
            <div class="icon">📜</div>
            <div class="title">Миссии</div>
            <div class="timer">3/5</div>
        </div>
        <div class="menu-card" onclick="openShop()">
            <div class="icon">🛒</div>
            <div class="title">Магазин</div>
            <div class="timer">Скидки</div>
        </div>
    </div>

    <!-- Центральная зона -->
    <div class="main-zone">
        <div class="coin-display">
            <div class="coin-icon">$</div>
            <div id="coinCount">0</div>
        </div>

        <div class="hamster-ring" id="hamsterRing" onclick="tap(event)">
            <!-- Реалистичный хомяк SVG -->
            <svg class="hamster" viewBox="0 0 200 200">
                <defs>
                    <radialGradient id="fur" cx="40%" cy="30%" r="60%">
                        <stop offset="0%" style="stop-color:#f5c98a"/>
                        <stop offset="100%" style="stop-color:#c47a3a"/>
                    </radialGradient>
                    <linearGradient id="suit" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#2a2a2a"/>
                        <stop offset="100%" style="stop-color:#111"/>
                    </linearGradient>
                    <filter id="glow">
                        <feGaussianBlur stdDeviation="3" result="blur"/>
                        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
                    </filter>
                </defs>
                <!-- Ноги -->
                <ellipse cx="75" cy="185" rx="22" ry="15" fill="#111"/>
                <ellipse cx="125" cy="185" rx="22" ry="15" fill="#111"/>
                <!-- Тело в костюме -->
                <path d="M60,190 C60,140 40,110 50,80 C60,55 100,45 150,55 C180,65 170,105 160,140 C150,180 155,190 155,190" fill="url(#suit)"/>
                <!-- Рубашка -->
                <path d="M80,100 L120,100 L100,140" fill="#f0f0f0"/>
                <!-- Галстук -->
                <polygon points="90,100 110,100 100,160" fill="#ff9800" filter="url(#glow)"/>
                <!-- Руки -->
                <path d="M45,120 Q25,130 30,145" stroke="#111" stroke-width="10" fill="none" stroke-linecap="round"/>
                <path d="M155,120 Q175,130 170,145" stroke="#111" stroke-width="10" fill="none" stroke-linecap="round"/>
                <!-- Голова -->
                <ellipse cx="100" cy="65" rx="58" ry="48" fill="url(#fur)"/>
                <!-- Уши -->
                <ellipse cx="55" cy="25" rx="20" ry="15" fill="#c47a3a"/>
                <ellipse cx="145" cy="25" rx="20" ry="15" fill="#c47a3a"/>
                <ellipse cx="55" cy="25" rx="10" ry="7" fill="#a0522d"/>
                <ellipse cx="145" cy="25" rx="10" ry="7" fill="#a0522d"/>
                <!-- Очки -->
                <rect x="60" y="50" width="80" height="26" rx="13" fill="rgba(0,0,0,0.85)"/>
                <rect x="55" y="48" width="90" height="4" fill="#111"/>
                <line x1="65" y1="55" x2="75" y2="70" stroke="#fff" stroke-width="2" opacity="0.4"/>
                <line x1="130" y1="55" x2="140" y2="70" stroke="#fff" stroke-width="2" opacity="0.4"/>
                <!-- Рот -->
                <path d="M85,90 Q100,100 115,90" stroke="#5d4037" stroke-width="3" fill="none"/>
                <!-- Брови -->
                <line x1="70" y1="45" x2="85" y2="47" stroke="#5d4037" stroke-width="5"/>
                <line x1="130" y1="45" x2="115" y2="47" stroke="#5d4037" stroke-width="5"/>
            </svg>
        </div>
    </div>

    <!-- Нижняя панель -->
    <div class="bottom-bar">
        <div class="energy">
            <span>⚡</span>
            <div class="energy-bar"><div class="energy-fill" id="energyFill"></div></div>
            <span id="energyCount">100 / 100</span>
        </div>
        <div class="boost" onclick="activateBoost()">🚀 Boost</div>
    </div>

    <!-- Модалка Казино -->
    <div class="modal" id="casinoModal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('casinoModal')">&times;</span>
            <h3>🎰 Казино</h3>
            <p style="color:#aaa; margin-bottom:10px;">Ставка: 100 LC</p>
            <div class="slot-machine" id="slot-machine">🍒 💎 7️⃣</div>
            <div class="result" id="casino-result"></div>
            <button class="boost" onclick="spinSlot()" style="width:100%; margin-top:10px;">Крутить</button>
        </div>
    </div>

    <!-- Модалка Колесо -->
    <div class="modal" id="wheelModal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('wheelModal')">&times;</span>
            <h3>🎡 Колесо Фортуны</h3>
            <p style="color:#aaa; margin-bottom:10px;">Бесплатный спин каждые 24 часа</p>
            <div class="result" id="wheel-result"></div>
            <button class="boost" onclick="spinWheel()" style="width:100%; margin-top:10px;">Крутить</button>
        </div>
    </div>

    <!-- Модалка Магазин -->
    <div class="modal" id="shopModal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('shopModal')">&times;</span>
            <h3>🛒 Магазин</h3>
            <div id="shop-items"></div>
        </div>
    </div>

    <!-- Модалка Миссии -->
    <div class="modal" id="missionsModal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('missionsModal')">&times;</span>
            <h3>📜 Ежедневные миссии</h3>
            <div id="missions-list"></div>
        </div>
    </div>

    <script>
        // ======== СОСТОЯНИЕ ========
        let state = {
            LC: 1000,
            QC: 0,
            energy: 100,
            maxEnergy: 100,
            tapValue: 15,
            profitPerHour: 0,
            critChance: 0.1,
            multiplier: 1,
            multiplierTimer: 0,
            robots: 0,
            farmLevel: 0,
            skins: { hat: false, glasses: false, chain: false },
            missions: { taps: 0, casinoWins: 0 },
            dailyWheel: 0,
            lastVisit: Date.now(),
            jackpot: 1000,
            discountTimer: 0,
            passiveMultiplier: 1,
        };

        // ======== ЗАГРУЗКА / СОХРАНЕНИЕ ========
        function saveGame() {
            localStorage.setItem('neonHamster', JSON.stringify(state));
        }

        function loadGame() {
            const saved = localStorage.getItem('neonHamster');
            if (saved) {
                const parsed = JSON.parse(saved);
                Object.assign(state, parsed);
            }
            const now = Date.now();
            const elapsed = Math.min(2 * 3600 * 1000, now - state.lastVisit);
            const offlineIncome = (state.robots * 20 + state.farmLevel * 50) * (elapsed / 3600000);
            if (offlineIncome > 0) {
                state.LC += offlineIncome;
                showOfflineReward(offlineIncome);
            }
            state.lastVisit = now;
            calculateProfitPerHour();
        }

        function showOfflineReward(amount) {
            const el = document.getElementById('offline-reward');
            el.textContent = `Оффлайн доход: +${Math.floor(amount)} LC`;
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 5000);
        }

        // ======== ОСНОВНЫЕ ========
        function calculateProfitPerHour() {
            state.profitPerHour = state.robots * 100 + state.farmLevel * 250;
            document.getElementById('profit').innerText = '+' + Math.floor(state.profitPerHour).toLocaleString('ru-RU');
        }

        function updateUI() {
            document.getElementById('coinCount').innerText = Math.floor(state.LC).toLocaleString('ru-RU');
            document.getElementById('energyCount').innerText = `${Math.floor(state.energy)} / ${state.maxEnergy}`;
            document.getElementById('energyFill').style.width = (state.energy / state.maxEnergy * 100) + '%';
            calculateProfitPerHour();
            updateHamsterSkin();
        }

        function updateHamsterSkin() {
            let outfit = '';
            if (state.skins.hat) outfit += '🎩';
            if (state.skins.glasses) outfit += '🕶️';
            if (state.skins.chain) outfit += '⛓️';
            document.getElementById('avatar').innerText = outfit + '🐹';
        }

        function tap(e) {
            if (state.energy <= 0) return;
            state.energy -= 1;
            let gain = state.tapValue * state.multiplier * state.passiveMultiplier;
            if (Math.random() < state.critChance) {
                gain *= 10;
                const ring = document.getElementById('hamsterRing');
                ring.style.transform = 'scale(1.1)';
                setTimeout(() => ring.style.transform = 'scale(1)', 150);
                playSound('crit');
                if (navigator.vibrate) navigator.vibrate(100);
            } else {
                playSound('tap');
                if (navigator.vibrate) navigator.vibrate(30);
            }
            state.LC += gain;
            state.missions.taps++;

            // Эффекты
            const rect = document.getElementById('hamsterRing').getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            // Летящий текст
            const floating = document.createElement('div');
            floating.className = 'floating-text';
            floating.innerText = '+' + Math.floor(gain);
            floating.style.left = (x - 20) + 'px';
            floating.style.top = (y - 40) + 'px';
            document.getElementById('hamsterRing').appendChild(floating);
            setTimeout(() => floating.remove(), 800);

            // Частицы
            for (let i = 0; i < 5; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                particle.style.setProperty('--dx', (Math.random() * 80 - 40) + 'px');
                particle.style.setProperty('--dy', (Math.random() * -60 - 20) + 'px');
                document.getElementById('hamsterRing').appendChild(particle);
                setTimeout(() => particle.remove(), 800);
            }

            updateUI();
            saveGame();
        }

        // ======== КАЗИНО ========
        function openCasino() {
            document.getElementById('casinoModal').style.display = 'flex';
            document.getElementById('casino-result').textContent = '';
        }

        function spinSlot() {
            if (state.LC < 100) {
                alert('Недостаточно LC!');
                return;
            }
            state.LC -= 100;
            state.jackpot += 10;
            const symbols = ['🍒', '💎', '7️⃣', '🐹'];
            const reels = [
                symbols[Math.floor(Math.random() * symbols.length)],
                symbols[Math.floor(Math.random() * symbols.length)],
                symbols[Math.floor(Math.random() * symbols.length)]
            ];
            document.getElementById('slot-machine').textContent = reels.join(' ');
            const resultDiv = document.getElementById('casino-result');
            if (reels[0] === '🐹' && reels[1] === '🐹' && reels[2] === '🐹') {
                state.LC += state.jackpot;
                state.QC += 10;
                resultDiv.innerHTML = `<span style="color:#ffd700;">ДЖЕКПОТ! +${state.jackpot} LC и +10 QC</span>`;
                state.jackpot = 1000;
                state.missions.casinoWins++;
                playSound('win');
            } else if (reels[0] === reels[1] && reels[1] === reels[2]) {
                const win = 100 * 10;
                state.LC += win;
                resultDiv.innerHTML = `<span style="color:#4caf50;">Выигрыш ${win} LC</span>`;
