<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Hamster: Casino Tycoon</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Courier New', monospace; background: linear-gradient(135deg, #0b0c2e, #2d1b69, #1b1b3a); color: #fff; overflow-x: hidden; }
        #game { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 10px; }
        #header { display: flex; justify-content: space-between; width: 100%; max-width: 400px; margin-bottom: 10px; font-size: 16px; text-shadow: 0 0 10px #00ffcc; }
        #energy { color: #ffcc00; }
        #hamster { width: 150px; height: 150px; border-radius: 50%; background: radial-gradient(circle, #ffb347, #ff7b00); display: flex; align-items: center; justify-content: center; font-size: 90px; cursor: pointer; transition: transform 0.1s; box-shadow: 0 0 30px #ffb347; margin: 20px 0; }
        #hamster:active { transform: scale(0.9); }
        #buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 400px; }
        .btn { padding: 12px; background: #222; border: 2px solid #ffcc00; border-radius: 10px; color: #fff; font-size: 14px; cursor: pointer; text-align: center; }
        .btn:active { background: #444; transform: scale(0.95); }
        #casino { grid-column: span 2; background: #d32f2f; }
        #wheel { background: #f57c00; }
        #shop { background: #388e3c; }
        #missions { background: #1976d2; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: #1e1e1e; padding: 20px; border-radius: 15px; width: 90%; max-width: 400px; max-height: 80vh; overflow-y: auto; border: 2px solid #ffcc00; }
        .modal-content h3 { margin-bottom: 15px; color: #ffcc00; }
        .close { float: right; font-size: 24px; cursor: pointer; }
        .item { background: #333; padding: 10px; margin: 8px 0; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .item button { background: #ffcc00; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; color: #000; font-weight: bold; }
        .slot-machine { font-size: 48px; text-align: center; margin: 15px 0; }
        #casino-result { text-align: center; font-size: 18px; margin: 10px 0; }
        .mission { display: flex; justify-content: space-between; margin: 10px 0; }
        .mission button { background: #ffcc00; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; }
        #offline-reward { display: none; position: fixed; top: 10px; left: 50%; transform: translateX(-50%); background: #4caf50; padding: 10px 20px; border-radius: 20px; font-size: 14px; z-index: 999; }
    </style>
</head>
<body>
    <div id="offline-reward"></div>
    <div id="game">
        <div id="header">
            <span id="score">LC: 0</span>
            <span id="qc">QC: 0</span>
            <span id="energy">⚡ 100/100</span>
        </div>
        <div id="hamster" onclick="tap()">🐹</div>
        <div id="buttons">
            <button class="btn" id="casino" onclick="openCasino()">🎰 Казино</button>
            <button class="btn" id="wheel" onclick="openWheel()">🎡 Колесо</button>
            <button class="btn" id="shop" onclick="openShop()">🛒 Магазин</button>
            <button class="btn" id="missions" onclick="openMissions()">📜 Миссии</button>
        </div>
    </div>

    <!-- Казино -->
    <div class="modal" id="casinoModal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('casinoModal')">&times;</span>
            <h3>🎰 Казино</h3>
            <p>Ставка: 50 LC</p>
            <div class="slot-machine" id="slot-machine">🍒 💎 7️⃣</div>
            <div id="casino-result"></div>
            <button class="btn" onclick="spinSlot()" style="background:#ffcc00;color:#000;margin-top:10px;">Крутить</button>
        </div>
    </div>

    <!-- Колесо -->
    <div class="modal" id="wheelModal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('wheelModal')">&times;</span>
            <h3>🎡 Колесо Фортуны</h3>
            <p>Бесплатный спин каждые 24 часа</p>
            <div id="wheel-result"></div>
            <button class="btn" onclick="spinWheel()" style="background:#ffcc00;color:#000;margin-top:10px;">Крутить</button>
        </div>
    </div>

    <!-- Магазин -->
    <div class="modal" id="shopModal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('shopModal')">&times;</span>
            <h3>🛒 Магазин</h3>
            <div id="shop-items"></div>
        </div>
    </div>

    <!-- Миссии -->
    <div class="modal" id="missionsModal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('missionsModal')">&times;</span>
            <h3>📜 Ежедневные миссии</h3>
            <div id="missions-list"></div>
        </div>
    </div>

    <script>
        // ======== ИГРОВЫЕ ДАННЫЕ ========
        let state = {
            LC: 100,
            QC: 0,
            energy: 100,
            maxEnergy: 100,
            robots: 0, // количество роботов
            farmLevel: 0,
            skins: { hat: false, glasses: false, chain: false },
            missions: { taps: 0, casinoWins: 0 },
            dailyWheel: 0, // timestamp последнего использования
            lastVisit: Date.now(),
            discountTimer: 0,
            discountItem: null,
            casinoLuck: 0.1, // шанс джекпота
            critChance: 0.1,
            multiplier: 1,
            multiplierTimer: 0,
            passiveMultiplier: 1,
        };

        // Загрузка/сохранение
        function saveGame() {
            localStorage.setItem('neonHamster', JSON.stringify(state));
        }

        function loadGame() {
            const saved = localStorage.getItem('neonHamster');
            if (saved) {
                const parsed = JSON.parse(saved);
                Object.assign(state, parsed);
            }
            // Оффлайн доход
            const now = Date.now();
            const elapsed = Math.min(2 * 3600 * 1000, now - state.lastVisit); // максимум 2 часа
            const offlineIncome = (state.robots * 2 + state.farmLevel * 10) * (elapsed / 1000);
            if (offlineIncome > 0) {
                state.LC += offlineIncome;
                showOfflineReward(offlineIncome);
            }
            state.lastVisit = now;
        }

        function showOfflineReward(amount) {
            const el = document.getElementById('offline-reward');
            el.textContent = `Оффлайн доход: +${Math.floor(amount)} LC`;
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 5000);
        }

        // ======== ОСНОВНЫЕ ФУНКЦИИ ========
        function tap() {
            if (state.energy <= 0) {
                alert('Энергия закончилась! Подожди.');
                return;
            }
            state.energy -= 1;
            let gain = 1 * state.multiplier * state.passiveMultiplier;
            // крит
            if (Math.random() < state.critChance) {
                gain *= 10;
                // анимация
                const h = document.getElementById('hamster');
                h.style.transform = 'scale(1.3)';
                setTimeout(() => h.style.transform = 'scale(1)', 150);
                playSound('crit');
            } else {
                playSound('tap');
            }
            state.LC += gain;
            state.missions.taps++;
            updateUI();
            saveGame();
        }

        // ======== КАЗИНО ========
        function openCasino() {
            document.getElementById('casinoModal').style.display = 'flex';
            document.getElementById('casino-result').textContent = '';
            // прогрессивный джекпот берём из state
        }

        function spinSlot() {
            if (state.LC < 50) {
                alert('Недостаточно LC');
                return;
            }
            state.LC -= 50;
            // прогрессивный джекпот добавляем
            if (!state.jackpot) state.jackpot = 1000;
            state.jackpot += 2.5; // 5% от ставки
            let symbols = ['🍒', '💎', '7️⃣', '🐹'];
            let reels = [
                symbols[Math.floor(Math.random() * symbols.length)],
                symbols[Math.floor(Math.random() * symbols.length)],
                symbols[Math.floor(Math.random() * symbols.length)]
            ];
            document.getElementById('slot-machine').textContent = reels.join(' ');
            let result = document.getElementById('casino-result');
            if (reels[0] === '🐹' && reels[1] === '🐹' && reels[2] === '🐹') {
                state.LC += state.jackpot;
                state.QC += 10;
                result.innerHTML = `<span style="color:#ffcc00;">ДЖЕКПОТ! +${state.jackpot} LC и +10 QC</span>`;
                state.jackpot = 1000;
                playSound('win');
            } else if (reels[0] === reels[1] && reels[1] === reels[2]) {
                let win = 50 * 10;
                state.LC += win;
                result.innerHTML = `<span style="color:#4caf50;">Выигрыш ${win} LC</span>`;
                playSound('win');
            } else if (reels[0] === reels[1] || reels[1] === reels[2] || reels[0] === reels[2]) {
                let win = 50 * 2;
                state.LC += win;
                result.innerHTML = `<span style="color:#4caf50;">Выигрыш ${win} LC</span>`;
                playSound('win');
            } else {
                result.innerHTML = '<span style="color:#f44336;">Проигрыш</span>';
                playSound('lose');
            }
            updateUI();
            saveGame();
        }

        // ======== КОЛЕСО ФОРТУНЫ ========
        function openWheel() {
            document.getElementById('wheelModal').style.display = 'flex';
            document.getElementById('wheel-result').textContent = '';
        }

        function spinWheel() {
            const now = Date.now();
            if (now - state.dailyWheel < 24 * 3600 * 1000) {
                alert('Колесо будет доступно через ' + Math.ceil((24*3600*1000 - (now - state.dailyWheel))/3600000) + ' ч');
                return;
            }
            state.dailyWheel = now;
            const prizes = [
                { type: 'LC', amount: 100 },
                { type: 'LC', amount: 500 },
                { type: 'QC', amount: 5 },
                { type: 'MULT', amount: 2 }
            ];
            const prize = prizes[Math.floor(Math.random() * prizes.length)];
            if (prize.type === 'LC') {
                state.LC += prize.amount;
                document.getElementById('wheel-result').innerHTML = `🎉 +${prize.amount} LC`;
            } else if (prize.type === 'QC') {
                state.QC += prize.amount;
                document.getElementById('wheel-result').innerHTML = `🎉 +${prize.amount} QC`;
            } else {
                state.multiplierTimer = 600; // 10 минут в секундах
                document.getElementById('wheel-result').innerHTML = `🎉 Множитель x2 на 10 минут!`;
            }
            updateUI();
            saveGame();
        }

        // ======== МАГАЗИН ========
        function openShop() {
            document.getElementById('shopModal').style.display = 'flex';
            renderShop();
        }

        function renderShop() {
            const container = document.getElementById('shop-items');
            let html = '';
            // Скины
            if (!state.skins.hat) {
                html += `<div class="item">Шляпа (100 LC) <button onclick="buySkin('hat')">Купить</button></div>`;
            }
            if (!state.skins.glasses) {
                html += `<div class="item">Очки (200 LC) <button onclick="buySkin('glasses')">Купить</button></div>`;
            }
            if (!state.skins.chain) {
                html += `<div class="item">Цепь (500 LC) <button onclick="buySkin('chain')">Купить</button></div>`;
            }
            // Роботы
            if (state.robots < 3) {
                let cost = [100, 500, 2000][state.robots];
                html += `<div class="item">Робот ур.${state.robots+1} (${cost} LC) <button onclick="buyRobot()">Купить</button></div>`;
            }
            // Ферма
            if (state.farmLevel < 5) {
                let cost = 200 * (state.farmLevel + 1);
                html += `<div class="item">Ферма ур.${state.farmLevel+1} (${cost} LC) <button onclick="buyFarm()">Купить</button></div>`;
            }
            container.innerHTML = html;
        }

        function buySkin(type) {
            const prices = { hat: 100, glasses: 200, chain: 500 };
            if (state.LC < prices[type]) { alert('Не хватает LC'); return; }
            state.LC -= prices[type];
            state.skins[type] = true;
            // баффы
            if (type === 'hat') state.maxEnergy += 20;
            if (type === 'glasses') state.critChance = 0.25;
            if (type === 'chain') state.robots += 1;
            updateUI();
            saveGame();
            renderShop();
        }

        function buyRobot() {
            const costs = [100, 500, 2000];
            if (state.robots >= 3) return;
            const cost = costs[state.robots];
            if (state.LC < cost) { alert('Не хватает LC'); return; }
            state.LC -= cost;
            state.robots++;
            updateUI();
            saveGame();
            renderShop();
        }

        function buyFarm() {
            if (state.farmLevel >= 5) return;
            const cost = 200 * (state.farmLevel + 1);
            if (state.LC < cost) { alert('Не хватает LC'); return; }
            state.LC -= cost;
            state.farmLevel++;
            updateUI();
            saveGame();
            renderShop();
        }

        // ======== МИССИИ ========
        function openMissions() {
            document.getElementById('missionsModal').style.display = 'flex';
            renderMissions();
        }

        function renderMissions() {
            const list = document.getElementById('missions-list');
            let html = '';
            // Миссия 1: 50 тапов
            if (state.missions.taps >= 50) {
                html += `<div class="mission">Сделать 50 тапов <button onclick="claimMission(1)">Забрать +100 LC</button></div>`;
            } else {
                html += `<div class="mission">Сделать 50 тапов (${state.missions.taps}/50) <span style="color:#888;">Ещё ${50-state.missions.taps}</span></div>`;
            }
            // Миссия 2: 3 победы в казино
            if (state.missions.casinoWins >= 3) {
                html += `<div class="mission">Выиграть 3 раза в казино <button onclick="claimMission(2)">Забрать +1 QC</button></div>`;
            } else {
                html += `<div class="mission">Выиграть 3 раза в казино (${state.missions.casinoWins}/3) <span style="color:#888;">Ещё ${3-state.missions.casinoWins}</span></div>`;
            }
            list.innerHTML = html;
        }

        function claimMission(num) {
            if (num === 1 && state.missions.taps >= 50) {
                state.LC += 100;
                state.missions.taps = 0;
            }
            if (num === 2 && state.missions.casinoWins >= 3) {
                state.QC += 1;
                state.missions.casinoWins = 0;
            }
            updateUI();
            saveGame();
            renderMissions();
        }

        // Обновляем casinoWins при выигрыше в слотах
        // (в функции spinSlot добавим state.missions.casinoWins++ при выигрыше)
        // Я уже вставил выше: в блоке выигрыша поставить state.missions.casinoWins++

        // ======== АВТО-ДОХОД (каждую секунду) ========
        setInterval(() => {
            // пассивный доход
            const passive = (state.robots * 2 + state.farmLevel * 10) * state.multiplier;
            state.LC += passive;
            // энергия регенерация
            if (state.energy < state.maxEnergy) {
                state.energy += 0.5;
                if (state.energy > state.maxEnergy) state.energy = state.maxEnergy;
            }
            // множитель таймер
            if (state.multiplierTimer > 0) {
                state.multiplierTimer--;
                if (state.multiplierTimer === 0) state.multiplier = 1;
            }
            // скидочный таймер
            if (state.discountTimer > 0) {
                state.discountTimer--;
            } else {
                // генерация скидки каждые 8 часов (28800 сек) - для теста сделаем каждые 10 мин
                if (Math.random() < 0.001) { // примерно раз в 16 мин
                    const items = ['robots', 'farm', 'skins'];
                    const chosen = items[Math.floor(Math.random()*items.length)];
                    state.discountItem = chosen;
                    state.discountTimer = 600;
                }
            }
            updateUI();
            saveGame();
        }, 1000);

        // ======== СЛУЧАЙНОЕ СОБЫТИЕ (летающий хомяк) ========
        // Создаём элемент каждые 5 минут
        setInterval(() => {
            if (Math.random() < 0.5) { // 50% шанс появиться
                spawnFlyingHamster();
            }
        }, 300000); // 5 минут

        function spawnFlyingHamster() {
            const h = document.createElement('div');
            h.textContent = '🐹';
            h.style.position = 'fixed';
            h.style.fontSize = '40px';
            h.style.zIndex = '9999';
            h.style.left = Math.random() * 80 + 'vw';
            h.style.top = Math.random() * 80 + 'vh';
            h.style.transition = 'transform 0.3s';
            h.style.cursor = 'pointer';
            h.onclick = () => {
                const reward = Math.random() < 0.8 ? Math.floor(Math.random()*1000) : 1;
                if (reward === 1) state.QC++;
                else state.LC += reward;
                updateUI();
                saveGame();
                h.remove();
                alert(`Поймал летающего хомяка! +${reward} ${reward===1?'QC':'LC'}`);
            };
            document.body.appendChild(h);
            // Анимация движения
            setTimeout(() => {
                h.style.transform = 'translate(20vw, -20vh) rotate(360deg)';
                setTimeout(() => h.remove(), 5000);
            }, 50);
        }

        // ======== ЗВУКИ (WebAudio) ========
        function playSound(type) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                if (type === 'tap') {
                    osc.frequency.value = 800;
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.1);
                } else if (type === 'crit') {
                    osc.frequency.value = 1200;
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.3);
                } else if (type === 'win') {
                    osc.frequency.val
