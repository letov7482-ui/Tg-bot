<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Hamster: Casino Tycoon</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0e1116; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Верхняя панель */
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: #14171c; border-bottom: 1px solid #222; }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 40px; height: 40px; background: #333; border-radius: 10px; border: 2px solid #4caf50; display: flex; align-items: center; justify-content: center; font-size: 24px; }
        .level { font-size: 12px; color: #aaa; }
        .profit { background: #222; padding: 5px 10px; border-radius: 20px; font-size: 12px; color: #ffd700; border: 1px solid #ffd70033; }
        .settings { font-size: 24px; color: #aaa; }

        /* Карточки меню */
        .menu-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 15px; }
        .menu-card { background: #1a1e26; border-radius: 15px; padding: 15px 10px; text-align: center; border: 1px solid #2a2e36; box-shadow: 0 4px 10px rgba(0,0,0,0.3); cursor: pointer; }
        .menu-card .icon { font-size: 30px; margin-bottom: 5px; filter: drop-shadow(0 0 5px #2196f3); }
        .menu-card .timer { font-size: 12px; color: #888; }
        .menu-card .title { font-size: 12px; color: #ccc; margin-bottom: 5px; }

        /* Центральная зона */
        .main-zone { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        .coin-display { display: flex; align-items: center; gap: 10px; font-size: 42px; font-weight: 900; color: #ffd700; text-shadow: 0 0 20px #ffd700; margin-bottom: 20px; }
        .coin-icon { width: 40px; height: 40px; border-radius: 50%; background: #ffd700; box-shadow: 0 0 10px #ffd700; display: flex; align-items: center; justify-content: center; color: #111; font-weight: bold; font-size: 20px; }
        
        /* Кольцо вокруг хомяка */
        .hamster-ring { width: 280px; height: 280px; border-radius: 50%; border: 6px solid transparent; background: linear-gradient(#0e1116, #0e1116) padding-box, linear-gradient(45deg, #2196f3, #1e2340) border-box; position: relative; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 40px rgba(33,150,243,0.5), inset 0 0 20px rgba(33,150,243,0.3); }
        .hamster { width: 200px; height: 200px; cursor: pointer; transition: transform 0.1s; }
        .hamster:active { transform: scale(0.95); }

        /* Нижняя панель */
        .bottom-bar { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: #14171c; border-top: 1px solid #222; }
        .energy { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: bold; color: #ffd700; }
        .energy-bar { width: 150px; height: 8px; background: #333; border-radius: 5px; overflow: hidden; }
        .energy-fill { width: 80%; height: 100%; background: linear-gradient(90deg, #ffd700, #ff8f00); }
        .boost { background: #2196f3; padding: 10px 20px; border-radius: 20px; font-weight: bold; color: #fff; box-shadow: 0 0 10px #2196f3; cursor: pointer; }

        /* Модальные окна */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: #1a1e26; padding: 20px; border-radius: 20px; width: 90%; max-width: 400px; max-height: 80vh; overflow-y: auto; border: 2px solid #2196f3; }
        .modal-content h3 { margin-bottom: 15px; color: #ffd700; }
        .close { float: right; font-size: 24px; cursor: pointer; color: #aaa; }
        .item { background: #222; padding: 10px; margin: 8px 0; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; }
        .item button { background: #ffd700; border: none; padding: 5px 12px; border-radius: 8px; cursor: pointer; color: #000; font-weight: bold; }
        .slot-machine { font-size: 48px; text-align: center; margin: 20px 0; }
        .result { text-align: center; font-size: 18px; margin: 10px 0; }
        .mission { display: flex; justify-content: space-between; margin: 10px 0; align-items: center; }
        .mission button { background: #ffd700; border: none; padding: 5px 12px; border-radius: 8px; cursor: pointer; }
        #offline-reward { display: none; position: fixed; top: 10px; left: 50%; transform: translateX(-50%); background: #4caf50; padding: 10px 20px; border-radius: 20px; font-size: 14px; z-index: 999; }

        /* Летящие цифры */
        .floating-text { position: absolute; font-size: 24px; font-weight: 900; color: #ffd700; pointer-events: none; animation: floatUp 0.8s ease-out forwards; text-shadow: 0 2px 4px #000; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-100px) scale(1.5); } }
    </style>
</head>
<body>
    <div id="offline-reward"></div>

    <!-- Верхняя панель -->
    <div class="top-bar">
        <div class="user-info">
            <div class="avatar" id="avatar">🐹</div>
            <div>
                <div style="font-weight: bold;">CEO (Ты)</div>
                <div class="level">Grandmaster > 9 / 11</div>
            </div>
        </div>
        <div class="profit">💎 Прибыль в час: <span id="profit">+0</span></div>
        <div class="settings">⚙️</div>
    </div>

    <!-- Карточки меню (кликабельные) -->
    <div class="menu-grid">
        <div class="menu-card" onclick="openWheel()">
            <div class="icon">🎡</div>
            <div class="title">Колесо</div>
            <div class="timer" id="wheelTimer">24:00</div>
        </div>
        <div class="menu-card" onclick="openMissions()">
            <div class="icon">📜</div>
            <div class="title">Миссии</div>
            <div class="timer">3/5</div>
        </div>
        <div class="menu-card" onclick="openShop()">
            <div class="icon">🛒</div>
            <div class="title">Магазин</div>
            <div class="timer">Скидки</div>
        </div>
    </div>

    <!-- Центральная зона -->
    <div class="main-zone" id="tapArea">
        <div class="coin-display">
            <div class="coin-icon">$</div>
            <div id="coinCount">0</div>
        </div>

        <div class="hamster-ring" onclick="tap(event)">
            <svg class="hamster" viewBox="0 0 200 200">
                <path d="M60,200 C60,150 40,120 50,80 C60,50 100,40 150,50 C180,60 170,100 160,140 C150,180 150,200 150,200" fill="#111" />
                <path d="M80,100 L120,100 L100,140" fill="#eee" />
                <polygon points="90,100 110,100 100,160" fill="#ff9800" />
                <ellipse cx="100" cy="60" rx="50" ry="40" fill="#e09b56" />
                <ellipse cx="60" cy="30" rx="15" ry="10" fill="#e09b56" />
                <ellipse cx="140" cy="30" rx="15" ry="10" fill="#e09b56" />
                <ellipse cx="60" cy="30" rx="8" ry="5" fill="#d8955e" />
                <ellipse cx="140" cy="30" rx="8" ry="5" fill="#d8955e" />
                <rect x="65" y="50" width="70" height="20" rx="10" fill="#111" />
                <rect x="60" y="48" width="80" height="4" fill="#111" />
                <line x1="70" y1="52" x2="80" y2="62" stroke="#fff" stroke-width="2" opacity="0.3"/>
                <line x1="120" y1="52" x2="130" y2="62" stroke="#fff" stroke-width="2" opacity="0.3"/>
                <path d="M90,85 Q100,95 110,85" stroke="#000" stroke-width="3" fill="none" />
            </svg>
        </div>
    </div>

    <!-- Нижняя панель -->
    <div class="bottom-bar">
        <div class="energy">
            <span>⚡</span>
            <div class="energy-bar"><div class="energy-fill" id="energyFill"></div></div>
            <span id="energyCount">0 / 100</span>
        </div>
        <div class="boost" onclick="activateBoost()">🚀 Boost</div>
    </div>

    <!-- Модалка Казино -->
    <div class="modal" id="casinoModal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('casinoModal')">&times;</span>
            <h3>🎰 Казино</h3>
            <p>Ставка: 100 LC</p>
            <div class="slot-machine" id="slot-machine">🍒 💎 7️⃣</div>
            <div class="result" id="casino-result"></div>
            <button class="boost" onclick="spinSlot()" style="width:100%;margin-top:10px;">Крутить</button>
        </div>
    </div>

    <!-- Модалка Колесо -->
    <div class="modal" id="wheelModal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('wheelModal')">&times;</span>
            <h3>🎡 Колесо Фортуны</h3>
            <p>Бесплатный спин каждые 24 часа</p>
            <div class="result" id="wheel-result"></div>
            <button class="boost" onclick="spinWheel()" style="width:100%;margin-top:10px;">Крутить</button>
        </div>
    </div>

    <!-- Модалка Магазин -->
    <div class="modal" id="shopModal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('shopModal')">&times;</span>
            <h3>🛒 Магазин</h3>
            <div id="shop-items"></div>
        </div>
    </div>

    <!-- Модалка Миссии -->
    <div class="modal" id="missionsModal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('missionsModal')">&times;</span>
            <h3>📜 Ежедневные миссии</h3>
            <div id="missions-list"></div>
        </div>
    </div>

    <script>
        // ======== СОСТОЯНИЕ ИГРЫ ========
        let state = {
            LC: 1000,           // Ломо-монеты
            QC: 0,              // Квантовые чипы
            energy: 100,
            maxEnergy: 100,
            tapValue: 13,
            profitPerHour: 0,
            critChance: 0.1,
            multiplier: 1,
            multiplierTimer: 0,
            robots: 0,
            farmLevel: 0,
            skins: { hat: false, glasses: false, chain: false },
            missions: { taps: 0, casinoWins: 0 },
            dailyWheel: 0,
            lastVisit: Date.now(),
            jackpot: 1000,
            discountTimer: 0,
            discountItem: null,
            passiveMultiplier: 1,
        };

        // ======== ЗАГРУЗКА / СОХРАНЕНИЕ ========
        function saveGame() {
            localStorage.setItem('neonHamster', JSON.stringify(state));
        }

        function loadGame() {
            const saved = localStorage.getItem('neonHamster');
            if (saved) {
                const parsed = JSON.parse(saved);
                Object.assign(state, parsed);
            }
            // Оффлайн доход
            const now = Date.now();
            const elapsed = Math.min(2 * 3600 * 1000, now - state.lastVisit);
            const offlineIncome = (state.robots * 20 + state.farmLevel * 50) * (elapsed / 3600000); // за час
            if (offlineIncome > 0) {
                state.LC += offlineIncome;
                showOfflineReward(offlineIncome);
            }
            state.lastVisit = now;
            calculateProfitPerHour();
        }

        function showOfflineReward(amount) {
            const el = document.getElementById('offline-reward');
            el.textContent = `Оффлайн доход: +${Math.floor(amount)} LC`;
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 5000);
        }

        // ======== ОСНОВНЫЕ ФУНКЦИИ ========
        function calculateProfitPerHour() {
            state.profitPerHour = state.robots * 100 + state.farmLevel * 250;
            document.getElementById('profit').innerText = '+' + Math.floor(state.profitPerHour).toLocaleString('ru-RU');
        }

        function updateUI() {
            document.getElementById('coinCount').innerText = Math.floor(state.LC).toLocaleString('ru-RU');
            document.getElementById('energyCount').innerText = `${Math.floor(state.energy)} / ${state.maxEnergy}`;
            document.getElementById('energyFill').style.width = (state.energy / state.maxEnergy * 100) + '%';
            calculateProfitPerHour();
            // Обновление скинов
            updateHamsterSkin();
        }

        function updateHamsterSkin() {
            let outfit = '';
            if (state.skins.hat) outfit += '🎩';
            if (state.skins.glasses) outfit += '🕶️';
            if (state.skins.chain) outfit += '⛓️';
            document.getElementById('avatar').innerText = outfit + '🐹';
            // Визуально на SVG пока не меняем, только аватар (упрощение)
        }

        function tap(e) {
            if (state.energy <= 0) {
                // Можно добавить анимацию уведомления
                return;
            }
            state.energy -= 1;
            let gain = state.tapValue * state.multiplier * state.passiveMultiplier;
            // крит
            if (Math.random() < state.critChance) {
                gain *= 10;
                // маленькая анимация
                const ring = document.querySelector('.hamster-ring');
                ring.style.transform = 'scale(1.1)';
                setTimeout(() => ring.style.transform = 'scale(1)', 150);
                playSound('crit');
            } else {
                playSound('tap');
            }
            state.LC += gain;
            state.missions.taps++;

            // Летящая цифра
            const rect = document.querySelector('.hamster-ring').getBoundingClientRect();
            const x = (e.clientX - rect.left) - 20;
            const y = (e.clientY - rect.top) - 40;
            const floating = document.createElement('div');
            floating.className = 'floating-text';
            floating.innerText = '+' + Math.floor(gain);
            floating.style.left = x + 'px';
            floating.style.top = y + 'px';
            document.querySelector('.hamster-ring').appendChild(floating);
            setTimeout(() => floating.remove(), 800);

            updateUI();
            saveGame();
        }

        // ======== КАЗИНО ========
        function openCasino() {
            document.getElementById('casinoModal').style.display = 'flex';
            document.getElementById('casino-result').textContent = '';
        }

        function spinSlot() {
            if (state.LC < 100) {
                alert('Недостаточно LC!');
                return;
            }
            state.LC -= 100;
            state.jackpot += 10; // прогрессивный джекпот
            const symbols = ['🍒', '💎', '7️⃣', '🐹'];
            const reels = [
                symbols[Math.floor(Math.random() * symbols.length)],
                symbols[Math.floor(Math.random() * symbols.length)],
                symbols[Math.floor(Math.random() * symbols.length)]
            ];
            document.getElementById('slot-machine').textContent = reels.join(' ');
            const resultDiv = document.getElementById('casino-result');
            if (reels[0] === '🐹' && reels[1] === '🐹' && reels[2] === '🐹') {
                state.LC += state.jackpot;
                state.QC += 10;
                resultDiv.innerHTML = `<span style="color:#ffd700;">ДЖЕКПОТ! +${state.jackpot} LC и +10 QC</span>`;
                state.jackpot = 1000;
                state.missions.casinoWins++;
                playSound('win');
            } else if (reels[0] === reels[1] && reels[1] === reels[2]) {
                const win = 100 * 10;
                state.LC += win;
                resultDiv.innerHTML = `<span style="color:#4caf50;">Выигрыш ${win} LC</span>`;
                state.missions.casinoWins++;
                playSound('win');
            } else if (reels[0] === reels[1] || reels[1] === reels[2] || reels[0] === reels[2]) {
                const win = 100 * 2;
                state.LC += win;
                resultDiv.innerHTML = `<span style="color:#4caf50;">Выигрыш ${win} LC</span>`;
                state.missions.casinoWins++;
                playSound('win');
            } else {
                resultDiv.innerHTML = '<span style="color:#f44336;">Проигрыш</span>';
                playSound('lose');
            }
            updateUI();
            saveGame();
        }

        // ======== КОЛЕСО ФОРТУНЫ ========
        function openWheel() {
            document.getElementById('wheelModal').style.display = 'flex';
            document.getElementById('wheel-result').textContent = '';
            updateWheelTimer();
        }

        function spinWheel() {
            const now = Date.now();
            if (now - state.dailyWheel < 24 * 3600 * 1000) {
                alert('Колесо будет доступно через ' + Math.ceil((24*3600*1000 - (now - state.dailyWheel))/3600000) + ' ч');
                return;
            }
            state.dailyWheel = now;
            const prizes = [
                { type: 'LC', amount: 1000 },
                { type: 'LC', amount: 5000 },
                { type: 'QC', amount: 5 },
                { type: 'MULT', amount: 2 }
            ];
            const prize = prizes[Math.floor(Math.random() * prizes.length)];
            if (prize.type === 'LC') {
                state.LC += prize.amount;
                document.getElementById('wheel-result').innerHTML = `🎉 +${prize.amount} LC`;
            } else if (prize.type === 'QC') {
                state.QC += prize.amount;
                document.getElementById('wheel-result').innerHTML = `🎉 +${prize.amount} QC`;
            } else {
                state.multiplierTimer = 600; // 10 минут в секундах
                state.multiplier = prize.amount;
                document.getElementById('wheel-result').innerHTML = `🎉 Множитель x${prize.amount} на 10 минут!`;
            }
            updateUI();
            saveGame();
        }

        function updateWheelTimer() {
            const now = Date.now();
            const diff = state.dailyWheel + 24*3600*1000 - now;
            if (diff <= 0) {
                document.getElementById('wheelTimer').innerText = 'Доступно!';
            } else {
                const hours = Math.floor(diff / 3600000);
                const minutes = Math.floor((diff % 3600000) / 60000);
                document.getElementById('wheelTimer').innerText = `${hours}:${minutes.toString().padStart(2,'0')}`;
            }
        }

        // ======== МАГАЗИН ========
        function openShop() {
            document.getElementById('shopModal').style.display = 'flex';
            renderShop();
        }

        function renderShop() {
            const container = document.getElementById('shop-items');
            let html = '';
            // Скины
            if (!state.skins.hat) {
                html += `<div class="item">Шляпа (1000 LC) <button onclick="buySkin('hat')">Купить</button></div>`;
            }
            if (!state.skins.glasses) {
                html += `<div class="item">Очки (2000 LC) <button onclick="buySkin('glasses')">Купить</button></div>`;
            }
            if (!state.skins.chain) {
                html += `<div class="item">Цепь (5000 LC) <button onclick="buySkin('chain')">Купить</button></div>`;
            }
            // Роботы
            if (state.robots < 3) {
                const costs = [1000, 5000, 20000];
                html += `<div class="item">Робот ур.${state.robots+1} (${costs[state.robots]} LC) <button onclick="buyRobot()">Купить</button></div>`;
            }
            // Ферма
            if (state.farmLevel < 5) {
                c
