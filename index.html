<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Tic-Tac-Toe</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  html, body { height: 100%; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; background: #05010f; color: #fff; }

  .bg-grid {
    position: fixed; inset: 0;
    background-image: linear-gradient(rgba(0,255,255,.07) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255,0,200,.07) 1px, transparent 1px);
    background-size: 40px 40px;
    animation: gridMove 20s linear infinite; z-index: 0;
  }
  @keyframes gridMove { from { background-position: 0 0,0 0; } to { background-position: 40px 40px,40px 40px; } }

  .glow-orb { position: fixed; border-radius: 50%; filter: blur(80px); opacity: .55; z-index: 0; pointer-events: none; animation: floatOrb 12s ease-in-out infinite; }
  .orb1 { width: 380px; height: 380px; background: #00e5ff; top: -120px; left: -120px; }
  .orb2 { width: 420px; height: 420px; background: #ff00c8; bottom: -150px; right: -130px; animation-delay: -4s; }
  .orb3 { width: 300px; height: 300px; background: #7a00ff; top: 40%; left: 50%; animation-delay: -8s; }
  @keyframes floatOrb { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(40px,-30px) scale(1.15); } }

  canvas#particles { position: fixed; inset: 0; z-index: 1; pointer-events: none; }

  .app { position: relative; z-index: 2; height: 100%; display: flex; align-items: center; justify-content: center; padding: 20px; }

  .screen { display: none; flex-direction: column; align-items: center; animation: fadeIn .6s cubic-bezier(.2,.9,.3,1.3); }
  .screen.active { display: flex; }
  @keyframes fadeIn { from { opacity: 0; transform: scale(.9) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }

  .title {
    font-size: clamp(38px, 9vw, 82px); font-weight: 900; letter-spacing: 6px; text-transform: uppercase; text-align: center; line-height: 1.05;
    background: linear-gradient(90deg, #00e5ff, #ff00c8, #00e5ff); background-size: 200% auto;
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    animation: shine 4s linear infinite; filter: drop-shadow(0 0 25px rgba(0,229,255,.6));
  }
  .title span { display: block; font-size: .55em; letter-spacing: 12px; margin-top: 6px; }
  @keyframes shine { to { background-position: 200% center; } }

  .subtitle { margin-top: 14px; color: #8ea8c3; letter-spacing: 4px; font-size: 13px; text-transform: uppercase; animation: pulse 2.5s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .5; } 50% { opacity: 1; } }

  .menu-buttons { margin-top: 48px; display: flex; flex-direction: column; gap: 18px; }

  .btn {
    position: relative; padding: 16px 46px; min-width: 280px;
    font-size: 17px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: #e6faff;
    background: rgba(0,229,255,.05); border: 2px solid rgba(0,229,255,.55); border-radius: 14px; cursor: pointer; overflow: hidden;
    transition: all .3s cubic-bezier(.2,.9,.3,1.3);
    box-shadow: 0 0 18px rgba(0,229,255,.25), inset 0 0 18px rgba(0,229,255,.05);
  }
  .btn::before { content: ''; position: absolute; inset: 0; background: linear-gradient(120deg, transparent, rgba(255,255,255,.35), transparent); transform: translateX(-120%); transition: transform .6s; }
  .btn:hover::before { transform: translateX(120%); }
  .btn:hover { transform: translateY(-3px) scale(1.03); border-color: #00e5ff; box-shadow: 0 0 35px rgba(0,229,255,.8), 0 0 70px rgba(0,229,255,.4), inset 0 0 25px rgba(0,229,255,.2); color: #fff; letter-spacing: 4px; }
  .btn:active { transform: translateY(0) scale(.98); }

  .btn.pink { border-color: rgba(255,0,200,.55); box-shadow: 0 0 18px rgba(255,0,200,.25), inset 0 0 18px rgba(255,0,200,.05); }
  .btn.pink:hover { border-color: #ff00c8; box-shadow: 0 0 35px rgba(255,0,200,.8), 0 0 70px rgba(255,0,200,.4), inset 0 0 25px rgba(255,0,200,.2); }

  .btn.purple { border-color: rgba(150,80,255,.55); box-shadow: 0 0 18px rgba(150,80,255,.25), inset 0 0 18px rgba(150,80,255,.05); }
  .btn.purple:hover { border-color: #9650ff; box-shadow: 0 0 35px rgba(150,80,255,.8), 0 0 70px rgba(150,80,255,.4), inset 0 0 25px rgba(150,80,255,.2); }

  .topbar { width: min(92vw, 520px); display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; gap: 12px; }

  .score-card { flex: 1; padding: 12px 16px; border-radius: 14px; background: rgba(255,255,255,.03); border: 1.5px solid rgba(255,255,255,.08); text-align: center; backdrop-filter: blur(8px); transition: all .35s; }
  .score-card.active { border-color: currentColor; box-shadow: 0 0 22px currentColor, inset 0 0 12px rgba(255,255,255,.05); transform: translateY(-3px); }
  .score-card.x { color: #00e5ff; }
  .score-card.o { color: #ff00c8; }
  .score-card .label { font-size: 11px; letter-spacing: 2px; opacity: .8; text-transform: uppercase; }
  .score-card .val { font-size: 26px; font-weight: 900; margin-top: 2px; }

  .turn-indicator { width: min(92vw, 520px); text-align: center; font-size: 15px; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 16px; min-height: 22px; color: #cfe8ff; transition: color .3s; }
  .turn-indicator.x { color: #00e5ff; text-shadow: 0 0 14px #00e5ff; }
  .turn-indicator.o { color: #ff00c8; text-shadow: 0 0 14px #ff00c8; }

  .board-wrap { position: relative; padding: 12px; border-radius: 22px; background: rgba(255,255,255,.02); border: 1.5px solid rgba(255,255,255,.08); box-shadow: 0 0 40px rgba(0,229,255,.12), inset 0 0 30px rgba(122,0,255,.08); backdrop-filter: blur(6px); }

  .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: min(92vw, 460px); aspect-ratio: 1; }

  .cell { position: relative; border-radius: 14px; background: linear-gradient(145deg, rgba(255,255,255,.04), rgba(255,255,255,.01)); border: 1.5px solid rgba(255,255,255,.09); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: clamp(48px, 14vw, 88px); font-weight: 900; transition: all .25s cubic-bezier(.2,.9,.3,1.3); overflow: hidden; }
  .cell::after { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at var(--mx,50%) var(--my,50%), rgba(255,255,255,.15), transparent 60%); opacity: 0; transition: opacity .3s; }
  .cell:hover:not(.filled)::after { opacity: 1; }
  .cell:hover:not(.filled) { border-color: rgba(0,229,255,.6); transform: translateY(-4px); box-shadow: 0 8px 26px rgba(0,229,255,.35), inset 0 0 20px rgba(0,229,255,.15); }
  .cell.filled { cursor: default; }

  .cell.x { color: #00e5ff; text-shadow: 0 0 22px #00e5ff, 0 0 44px rgba(0,229,255,.7); }
  .cell.o { color: #ff00c8; text-shadow: 0 0 22px #ff00c8, 0 0 44px rgba(255,0,200,.7); }

  .cell .mark { display: inline-block; animation: popIn .45s cubic-bezier(.2,1.6,.4,1.2); }
  @keyframes popIn { 0% { transform: scale(0) rotate(-180deg); opacity: 0; } 60% { transform: scale(1.25) rotate(15deg); opacity: 1; } 100% { transform: scale(1) rotate(0); } }

  .cell.win { animation: winPulse 1s ease-in-out infinite; border-color: currentColor; background: linear-gradient(145deg, rgba(255,255,255,.12), rgba(255,255,255,.03)); }
  .cell.x.win { box-shadow: 0 0 30px #00e5ff, inset 0 0 25px rgba(0,229,255,.4); }
  .cell.o.win { box-shadow: 0 0 30px #ff00c8, inset 0 0 25px rgba(255,0,200,.4); }
  @keyframes winPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }

  .bottom-actions { margin-top: 24px; display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  .btn-small { padding: 12px 28px; font-size: 13px; min-width: auto; border-radius: 12px; }

  .overlay { position: fixed; inset: 0; background: rgba(5,1,15,.82); backdrop-filter: blur(10px); z-index: 50; display: none; align-items: center; justify-content: center; flex-direction: column; animation: fadeIn .35s ease; }
  .overlay.active { display: flex; }

  .result-title { font-size: clamp(38px, 10vw, 78px); font-weight: 900; letter-spacing: 5px; text-transform: uppercase; animation: resultPop .7s cubic-bezier(.2,1.6,.4,1.1); text-align: center; padding: 0 20px; }
  @keyframes resultPop { 0% { transform: scale(.3) rotate(-8deg); opacity: 0; } 70% { transform: scale(1.15) rotate(3deg); opacity: 1; } 100% { transform: scale(1) rotate(0); opacity: 1; } }
  .result-title.win-x { color: #00e5ff; text-shadow: 0 0 40px #00e5ff, 0 0 80px #00e5ff; }
  .result-title.win-o { color: #ff00c8; text-shadow: 0 0 40px #ff00c8, 0 0 80px #ff00c8; }
  .result-title.draw { color: #fff; text-shadow: 0 0 40px #9650ff, 0 0 80px #9650ff; }

  .result-sub { margin-top: 10px; color: #8ea8c3; letter-spacing: 5px; font-size: 13px; text-transform: uppercase; }
  .result-actions { margin-top: 40px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }

  @media (max-width: 480px) {
    .btn { min-width: 240px; padding: 14px 30px; font-size: 15px; letter-spacing: 2px; }
    .title span { letter-spacing: 6px; }
  }
</style>
</head>
<body>

<div class="bg-grid"></div>
<div class="glow-orb orb1"></div>
<div class="glow-orb orb2"></div>
<div class="glow-orb orb3"></div>
<canvas id="particles"></canvas>

<div class="app">

  <!-- ========== ГЛАВНОЕ МЕНЮ ========== -->
  <div class="screen active" id="menuScreen">
    <h1 class="title">Крестики<span>Нолики</span></h1>
    <div class="subtitle">Neon · AI · Edition</div>

    <div class="menu-buttons">
      <button class="btn" onclick="startGame('ai')">🤖 Против ИИ</button>
      <button class="btn pink" onclick="startGame('pvp')">👥 Два игрока (1 на 1)</button>
      <button class="btn purple" onclick="showDifficulty()">⚙️ Сложность</button>
    </div>

    <div class="subtitle" style="margin-top:34px; font-size:11px;">
      Made with AI · <span id="diffLabel">Сложность: Средняя</span>
    </div>
  </div>

  <!-- ========== ЭКРАН ИГРЫ ========== -->
  <div class="screen" id="gameScreen">
    <div class="topbar">
      <div class="score-card x" id="cardX">
        <div class="label" id="labelX">Игрок X</div>
        <div class="val" id="scoreX">0</div>
      </div>
      <div class="score-card o" id="cardO">
        <div class="label" id="labelO">Игрок O</div>
        <div class="val" id="scoreO">0</div>
      </div>
    </div>

    <div class="turn-indicator x" id="turnIndicator">Ход: X</div>

    <div class="board-wrap">
      <div class="board" id="board"></div>
    </div>

    <div class="bottom-actions">
      <button class="btn btn-small" onclick="resetRound()">🔄 Заново</button>
      <button class="btn btn-small pink" onclick="backToMenu()">🏠 Меню</button>
    </div>
  </div>

  <!-- ========== ОВЕРЛЕЙ РЕЗУЛЬТАТА ========== -->
  <div class="overlay" id="overlay">
    <div class="result-title" id="resultTitle">ПОБЕДА!</div>
    <div class="result-sub" id="resultSub"></div>
    <div class="result-actions">
      <button class="btn" onclick="resetRound(); closeOverlay()">▶ Ещё раз</button>
      <button class="btn pink" onclick="closeOverlay(); backToMenu()">🏠 Меню</button>
    </div>
  </div>

</div>

<script>
/* ============================================================
   ЗВУК (Web Audio API, без файлов)
============================================================ */
const Sound = (() => {
  let ctx;
  const init = () => { if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)(); };
  const tone = (freq, dur=0.12, type='sine', vol=0.15, delay=0) => {
    try {
      init();
      const t = ctx.currentTime + delay;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t);
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(vol, t + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t); osc.stop(t + dur + 0.02);
    } catch(e) {}
  };
  return {
    click: () => tone(660, 0.08, 'square', 0.08),
    place: () => { tone(520, 0.1, 'triangle', 0.12); tone(780, 0.14, 'sine', 0.08, 0.05); },
    win:   () => [523,659,784,1047].forEach((f,i)=>tone(f,0.25,'sine',0.15,i*0.09)),
    draw:  () => { tone(300,0.3,'sawtooth',0.1); tone(220,0.35,'sawtooth',0.1,0.15); },
    menu:  () => { tone(440,0.1,'triangle',0.12); tone(660,0.14,'triangle',0.12,0.08); }
  };
})();

/* ============================================================
   СОСТОЯНИЕ
============================================================ */
const board = new Array(9).fill('');
let current = 'X';
let gameOver = false;
let mode = 'ai';          // 'ai' | 'pvp'
let difficulty = 'medium'; // 'easy' | 'medium' | 'hard'
let scores = { X: 0, O: 0 };
let aiThinking = false;
let winLine = null;

const WIN_LINES = [
  [0,1,2],[3,4,5],[6,7,8],
  [0,3,6],[1,4,7],[2,5,8],
  [0,4,8],[2,4,6]
];

const $ = (id) => document.getElementById(id);

/* ============================================================
   МЕНЮ
============================================================ */
function showDifficulty() {
  Sound.menu();
  const opts = ['easy','medium','hard'];
  const names = { easy: 'Лёгкая', medium: 'Средняя', hard: 'Невозможная' };
  const idx = (opts.indexOf(difficulty) + 1) % opts.length;
  difficulty = opts[idx];
  $('diffLabel').textContent = 'Сложность: ' + names[difficulty];
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
}

function startGame(m) {
  Sound.menu();
  mode = m;
  scores = { X: 0, O: 0 };
  if (m === 'ai') {
    $('labelX').textContent = 'Игрок (X)';
    $('labelO').textContent = 'ИИ (O)';
  } else {
    $('labelX').textContent = 'Игрок 1 (X)';
    $('labelO').textContent = 'Игрок 2 (O)';
  }
  updateScores();
  showScreen('gameScreen');
  resetRound();
}

function backToMenu() {
  Sound.menu();
  closeOverlay();
  showScreen('menuScreen');
}

/* ============================================================
   РАУНД
============================================================ */
function resetRound() {
  Sound.click();
  board.fill('');
  current = 'X';
  gameOver = false;
  aiThinking = false;
  winLine = null;
  renderBoard();
  updateTurn();
  updateActiveCards();
}

function renderBoard() {
  const el = $('board');
  el.innerHTML = '';
  for (let i = 0; i < 9; i++) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.dataset.i = i;
    if (board[i]) {
      cell.classList.add('filled', board[i].toLowerCase());
      const mark = document.createElement('span');
      mark.className = 'mark';
      mark.textContent = board[i] === 'X' ? '✕' : '◯';
      cell.appendChild(mark);
    }
    cell.addEventListener('click', () => onCellClick(i));
    cell.addEventListener('mousemove', e => {
      const r = cell.getBoundingClientRect();
      cell.style.setProperty('--mx', ((e.clientX - r.left) / r.width * 100) + '%');
      cell.style.setProperty('--my', ((e.clientY - r.top) / r.height * 100) + '%');
    });
    el.appendChild(cell);
  }
}

function onCellClick(i) {
  if (gameOver || board[i] || aiThinking) return;
  // В режиме против ИИ человек всегда играет за X
  if (mode === 'ai' && current === 'O') return;

  makeMove(i, current);

  // Если это ИИ-режим и ход перешёл к ИИ — запустить его
  if (!gameOver && mode === 'ai' && current === 'O') {
    aiMove();
  }
  // В PvP ничего дополнительно — второй игрок кликает сам
}

function makeMove(i, player) {
  if (board[i] || gameOver) return;
  board[i] = player;
  Sound.place();

  const cell = document.querySelector(`.cell[data-i="${i}"]`);
  if (cell) {
    cell.classList.add('filled', player.toLowerCase());
    const mark = document.createElement('span');
    mark.className = 'mark';
    mark.textContent = player === 'X' ? '✕' : '◯';
    cell.appendChild(mark);
  }

  const line = checkWin(player);
  if (line) {
    winLine = line;
    gameOver = true;
    scores[player]++;
    updateScores();
    setTimeout(() => {
      highlightWin(line);
      showResult(player);
    }, 350);
    return;
  }

  if (board.every(c => c)) {
    gameOver = true;
    setTimeout(() => showResult(null), 350);
    return;
  }

  current = current === 'X' ? 'O' : 'X';
  updateTurn();
  updateActiveCards();
}

function checkWin(p) {
  for (const line of WIN_LINES) {
    const [a,b,c] = line;
    if (board[a] === p && board[b] === p && board[c] === p) return line;
  }
  return null;
}

function highlightWin(line) {
  line.forEach(i => {
    const cell = document.querySelector(`.cell[data-i="${i}"]`);
    if (cell) cell.classList.add('win');
  });
}

function showResult(winner) {
  const overlay = $('overlay');
  const title = $('resultTitle');
  const sub = $('resultSub');

  if (winner) {
    Sound.win();
    title.className = 'result-title ' + (winner === 'X' ? 'win-x' : 'win-o');
    title.textContent = 'ПОБЕДА!';
    let name;
    if (mode === 'ai') {
      name = (winner === 'X') ? 'Ты победил!' : 'ИИ победил';
    } else {
      name = (winner === 'X') ? 'Игрок 1 (X) выиграл' : 'Игрок 2 (O) выиграл';
    }
    sub.textContent = name + ' · ' + scores[winner] + ' очко(в)';
    burstParticles(winner === 'X' ? '#00e5ff' : '#ff00c8');
  } else {
    Sound.draw();
    title.className = 'result-title draw';
    title.textContent = 'НИЧЬЯ';
    sub.textContent = 'Отличная игра!';
    burstParticles('#9650ff');
  }
  overlay.classList.add('active');
}

function closeOverlay() {
  $('overlay').classList.remove('active');
}

function updateTurn() {
  const el = $('turnIndicator');
  el.className = 'turn-indicator ' + current.toLowerCase();
  let name;
  if (mode === 'ai') {
    name = (current === 'X') ? 'Твой ход (X)' : 'Ход ИИ (O)';
  } else {
    name = (current === 'X') ? 'Ход Игрока 1 (X)' : 'Ход Игрока 2 (O)';
  }
  el.textContent = name;
}

function updateScores() {
  $('scoreX').textContent = scores.X;
  $('scoreO').textContent = scores.O;
}

function updateActiveCards() {
  $('cardX').classList.toggle('active', current === 'X' && !gameOver);
  $('cardO').classList.toggle('active', current === 'O' && !gameOver);
}

/* ============================================================
   ИИ: Minimax + альфа-бета
============================================================ */
function aiMove() {
  aiThinking = true;
  const delay = 350 + Math.random() * 300;
  setTimeout(() => {
    const empty = board.map((v,i) => v ? null : i).filter(v => v !== null);
    if (empty.length === 0) { aiThinking = false; return; }

    let move;
    if (difficulty === 'easy') {
      move = empty[Math.floor(Math.random() * empty.length)];
    } else if (difficulty === 'medium') {
      move = Math.random() < 0.65 ? bestMove('O') : empty[Math.floor(Math.random() * empty.length)];
    } else {
      move = bestMove('O');
    }

    aiThinking = false;
    makeMove(move, 'O');

    // Если вдруг после хода ИИ ход снова ИИ (не должно быть, но на всякий)
    if (!gameOver && mode === 'ai' && current === 'O') aiMove();
  }, delay);
}

function bestMove(player) {
  let best = -Infinity, move = null;
  const b = board.slice();
  for (let i = 0; i < 9; i++) {
    if (b[i]) continue;
    b[i] = player;
    const score = minimax(b, 0, false, -Infinity, Infinity);
    b[i] = '';
    if (score > best) { best = score; move = i; }
  }
  return move;
}

function minimax(b, depth, isMax, alpha, beta) {
  if (checkWinArr(b, 'O')) return 10 - depth;
  if (checkWinArr(b, 'X')) return depth - 10;
  if (b.every(c => c)) return 0;

  if (isMax) {
    let best = -Infinity;
    for (let i = 0; i < 9; i++) {
      if (b[i]) continue;
      b[i] = 'O';
      best = Math.max(best, minimax(b, depth+1, false, alpha, beta));
      b[i] = '';
      alpha = Math.max(alpha, best);
      if (beta <= alpha) break;
    }
    return best;
  } els {
    let best = Infinity;
    for (let i = 0; i < 9; i++) {
      if (b[i]) continue;
      b[i] = 'X';
      best = Math.min(best, minimax(b, depth+1, true, alpha, beta));
      b[i] = '';
      beta = Math.min(beta, best);
      if (beta <= alpha) break;
    }
    return best;
  }
}

function checkWinArr(b, p) {
  for (const [a,c,d] of WIN_LINES) {
    if (b[a] === p && b[c] === p && b[d] === p) return true;
  }
  return false;
}

/* ============================================================
   ЧАСТИЦЫ (фон + всплеск победы)
============================================================ */
const canvas = document.getElementById('particles');
const ctx2d = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
resize();
addEventListener('resize', resize);

const bgParticles = [];
for (let i = 0; i < 60; i++) {
  bgParticles.push({
    x: Math.random() * W,
    y: Math.random() * H,
    r: Math.random() * 1.8 + 0.3,
    vx: (Math.random() - 0.5) * 0.3,
    vy: (Math.random() - 0.5) * 0.3,
    c: Math.random() < 0.5 ? '0,229,255' : '255,0,200',
    a: Math.random() * 0.6 + 0.2
  });
}

const burst = [];
function burstParticles(color) {
  const rgb = color === '#00e5ff' ? '0,229,255'
            : color === '#ff00c8' ? '255,0,200'
            : '150,80,255';
  const cx = W / 2, cy = H / 2;
  for (let i = 0; i < 120; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 7 + 2;
    burst.push({
      x: cx, y: cy,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      r: Math.random() * 3 + 1,
      life: 1,
      c: rgb
    });
  }
}

function drawParticles() {
  ctx2d.clearRect(0, 0, W, H);

  // фоновые
  bgParticles.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
    if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
    ctx2d.beginPath();
    ctx2d.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx2d.fillStyle = `rgba(${p.c},${p.a})`;
    ctx2d.shadowColor = `rgba(${p.c},1)`;
    ctx2d.shadowBlur = 12;
    ctx2d.fill();
  });

  // всплеск
  for (let i = burst.length - 1; i >= 0; i--) {
    const p = burst[i];
    p.x += p.vx; p.y += p.vy;
    p.vx *= 0.97; p.vy *= 0.97;
    p.vy += 0.05;
    p.life -= 0.012;
    if (p.life <= 0) { burst.splice(i, 1); continue; }
    ctx2d.beginPath();
    ctx2d.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx2d.fillStyle = `rgba(${p.c},${p.life})`;
    ctx2d.shadowColor = `rgba(${p.c},1)`;
    ctx2d.shadowBlur = 15;
    ctx2d.fill();
  }

  ctx2d.shadowBlur = 0;
  requestAnimationFrame(drawParticles);
}
drawParticles();

/* ============================================================
   Инициализация: не дать браузеру заснуть на AudioContext
============================================================ */
document.addEventListener('click', () => Sound.click(), { once: true });
</script>
