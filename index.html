<html lang="ru">
<head>

<title>Собеседник — тестовый чат</title>

  [["мотивация","вдохнови меня","лень","не хочу ничего делать","нет сил"],

   ["42, если верить классике 😄","Может, смысл в том, чтобы искать смысл?","У каждого свой ответ."]],

   ["Спокойной ночи! Пусть приснится хорошее 🌙","Сладких снов!","Ночи! 😴"]],

  [["доброе утро","с добрым утром","утро доброе"],
   ["Доброе утро! ☀️","С добрым утром! Хорошего дня!","Просыпайся, мир ждёт тебя 🌅"]],

  [["хочу есть","есть охота","проголодался","покушать"],
   ["Может, пора перекусить? 🍕","Голод — не тётка, иди есть!"]],

  [["с днём рождения","днюха","поздравляю","с праздником"],

const JOKES = [
  "Программист заходит в бар. Заказывает пиво. Заказывает 0 пива. Заказывает 999999999 пива. Заказывает ящерицу. Бар горит.",
  "— Почему программисты путают Хэллоуин и Рождество? — Потому что OCT 31 == DEC 25.",
  "Уровень нуля в программировании: массив начинается с единицы.",
  "— Сколько программистов нужно, чтобы вкрутить лампочку? — Ни одного, это аппаратная проблема.",
  "Есть два типа людей: те, кто делает бэкапы, и те, кто ещё не терял данные.",
  "Самая страшная фраза в IT: «Работало на моей машине».",
  "Кот прошёлся по клавиатуре и написал более рабочий код, чем я за сегодня."
];

const QUOTES = [
  "«Единственный способ сделать что-то великое — любить то, что ты делаешь» — Стив Джобс",
  "«Будь собой — все остальные роли уже заняты» — Оскар Уайльд",
  "«Не бойся идти медленно, бойся стоять на месте» — китайская пословица",
  "«Успех — это способность двигаться от неудачи к неудаче без потери энтузиазма» — Уинстон Черчилль",
  "«Лучшее время посадить дерево было 20 лет назад. Следующее лучшее — сейчас»"
];

const HOROSCOPE = {
  "овен":"Сегодня удачный день для новых начинаний. Дерзай!",
  "телец":"Сосредоточься на комфорте и стабильности — они принесут плоды.",
  "близнецы":"День общения — используй его для важных разговоров.",
  "рак":"Прислушайся к интуиции, она сегодня особенно точна.",
  "лев":"Твоя энергия притягивает удачу — не стесняйся проявляться.",
  "дева":"Порядок и планирование сегодня решают всё.",
  "весы":"Ищи баланс — в делах и в отношениях.",
  "скорпион":"День для глубоких решений и смелых шагов.",
  "стрелец":"Открывай новые горизонты, удача благоволит путешествиям.",
  "козерог":"Терпение и дисциплина сегодня окупятся сполна.",
  "водолей":"Необычные идеи сегодня — твоя суперсила.",
  "рыбы":"Доверься творчеству и своим чувствам."
};

const HELP_TEXT =
`Вот что я умею:
• Просто пиши — я реагирую на десятки слов и фраз
• «анекдот» — рассказать анекдот
• «цитата» — умная цитата
• «гороскоп лев» — гороскоп по знаку
• «монетка» — подбросить монетку
• «кубик» — бросить кубик
• «настроение» — узнать моё текущее настроение
• «teach: фраза|ответ» — научить меня новому ответу`;

// --- обучение (сохраняется в этом браузере через localStorage,
//     с запасным вариантом в памяти, если localStorage недоступен)
const memoryStore = {};
function storageGet(key){
  try { return JSON.parse(localStorage.getItem(key)) || {}; }
  catch(e){ return memoryStore[key] || {}; }
}
function storageSet(key, val){
  try { localStorage.setItem(key, JSON.stringify(val)); }
  catch(e){ memoryStore[key] = val; }
}
let learned = storageGet("learned_phrases");

function teach(word, answer){
  word = word.toLowerCase().trim();
  if(!learned[word]) learned[word] = [];
  if(!learned[word].includes(answer)) learned[word].push(answer);
  storageSet("learned_phrases", learned);
}

// --- построение плоского индекса ключевых слов
const WORD_INDEX = {};
TRIGGER_GROUPS.forEach(([keywords, responses]) => {
  keywords.forEach(kw => WORD_INDEX[kw] = responses);
});

function normalize(text){
  return text.toLowerCase().trim().replace(/[^\wа-яё\s]/gi, "");
}

// --- простое нечёткое сравнение строк (аналог difflib.SequenceMatcher)
function similarity(a, b){
  if(a === b) return 1;
  const longer = a.length > b.length ? a : b;
  const shorter = a.length > b.length ? b : a;
  if(longer.length === 0) return 1;
  let matches = 0;
  for(let i=0;i<shorter.length;i++){
    if(longer.includes(shorter[i])) matches++;
  }
  return matches / longer.length;
}

function fuzzyMatch(text, candidates, threshold=0.6){
  let best=null, bestScore=0;
  candidates.forEach(c=>{
    const s = similarity(text, c);
    if(s > bestScore){ best=c; bestScore=s; }
  });
  return bestScore >= threshold ? best : null;
}

// --- "настроение" бота — меняется каждые 3 часа псевдослучайно
const MOODS = [["бодрое","⚡"],["спокойное","😌"],["игривое","😜"],["сонное","😴"],["вдохновлённое","✨"],["философское","🤔"]];
function seededRandom(seed){
  const x = Math.sin(seed) * 10000;
  return x - Math.floor(x);
}
function currentMood(){
  const now = new Date();
  const slot = Math.floor(now.getHours()/3) + now.getDate()*100;
  const idx = Math.floor(seededRandom(slot) * MOODS.length);
  return MOODS[idx];
}
function isNight(){
  const h = new Date().getHours();
  return h >= 0 && h < 6;
}

function applyMoodTone(text){
  const [name, emoji] = currentMood();
  if(isNight()) return `${text} ${emoji}\n(сейчас ночь, отвечаю тише обычного)`;
  return `${text} ${emoji}`;
}

function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

// --- основная функция генерации ответа
function findResponse(raw){
  const norm = normalize(raw);

  // спец-команды
  if(norm.startsWith("teach:") || raw.includes("|") && raw.toLowerCase().startsWith("teach")){
    const body = raw.replace(/teach:?/i, "").trim();
    const [word, answer] = body.split("|").map(s => s && s.trim());
    if(word && answer){
      teach(word, answer);
      return `Запомнил! Теперь на «${word}» я могу ответить: «${answer}» 🧠`;
    }
    return "Формат: teach: фраза|твой ответ";
  }
  if(["сколько времени","который час"].some(w=>norm.includes(w))){
    return `Сейчас ${new Date().toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"})} ⏰`;
  }
  if(["какое сегодня число","какой день"].some(w=>norm.includes(w))){
    return `Сегодня ${new Date().toLocaleDateString("ru-RU")} 📅`;
  }
  if(["что ты умеешь","твои функции","команды","помощь","help"].some(w=>norm.includes(w))){
    return HELP_TEXT;
  }
  if(norm.includes("анекдот") || norm.includes("пошути") || norm.includes("расскажи шутку")){
    return pick(JOKES);
  }
  if(norm.includes("цитата") || norm.includes("мудрость") || norm.includes("афоризм")){
    return pick(QUOTES);
  }
  if(norm.includes("гороскоп")){
    const sign = Object.keys(HOROSCOPE).find(s => norm.includes(s));
    if(sign) return `${sign[0].toUpperCase()+sign.slice(1)}: ${HOROSCOPE[sign]}`;
    return "Укажи знак зодиака, например: «гороскоп лев»";
  }
  if(norm.includes("монетк")){
    return pick(["Орёл! 🪙","Решка! 🪙"]);
  }
  if(norm.includes("кубик")){
    return `Выпало: ${1+Math.floor(Math.random()*6)} 🎲`;
  }
  if(norm.includes("настроение") && norm.includes("тво") === false && norm.includes("как настроение")===false){
    const [name, emoji] = currentMood();
    return `Моё текущее настроение: ${name} ${emoji}`;
  }

  // 1. точное совпадение по ключевым словам
  for(const kw in WORD_INDEX){
    if(norm.includes(kw)) return applyMoodTone(pick(WORD_INDEX[kw]));
  }
  // 2. выученные фразы
  for(const kw in learned){
    if(norm.includes(kw) && learned[kw].length) return applyMoodTone(pick(learned[kw]));
  }
  // 3. нечёткий поиск
  const allKeywords = Object.keys(WORD_INDEX).concat(Object.keys(learned));
  const match = fuzzyMatch(norm, allKeywords, 0.55);
  if(match){
    const pool = WORD_INDEX[match] || learned[match];
    if(pool && pool.length) return "Похоже, ты имел в виду что-то похожее 🙂\n" + applyMoodTone(pick(pool));
  }

  return "Хм, пока не знаю, как на это ответить 🤷\nНаучи меня: «teach: твоя фраза|желаемый ответ»";
}

}

function refreshMoodTag(){
  const [name, emoji] = currentMood();
  moodTag.textContent = `${emoji} ${name}${isNight() ? " · ночь" : ""}`;
}

function respond(userText){
  addMessage(userText, "user");
  showTyping();
  const delay = 500 + Math.random()*700;
  setTimeout(() => {
    hideTyping();
    const answer = findResponse(userText);
    addMessage(answer, "bot");
    refreshMoodTag();
  }, delay);
}

form.addEventListener("submit", (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if(!text) return;
  input.value = "";
  respond(text);
});

quick.addEventListener("click", (e) => {
  const chip = e.target.closest(".chip");
  if(!chip) return;
  respond(chip.dataset.msg);
});

// приветственное сообщение при загрузке
window.addEventListener("load", () => {
  refreshMoodTag();
  setTimeout(() => {
    addMessage("Привет! Я тестовый ИИ-собеседник 🤖 Спрашивай что угодно — попробуй «анекдот», «гороскоп лев» или просто поболтай.", "bot");
  }, 300);
});
</script>
</body>
</html>
