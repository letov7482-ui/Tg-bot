<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>METRO ROYALE 2D</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background: #0a0f14; overflow: hidden; touch-action: none; }
        #gameCanvas { display: block; width: 100vw; height: 100vh; }
        
        /* HUD */
        #hud { position: fixed; top: 10px; left: 10px; right: 10px; display: flex; flex-direction: column; pointer-events: none; z-index: 10; }
        .hud-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .hud-item { background: rgba(0,0,0,0.75); padding: 6px 14px; border-radius: 20px; font-size: 14px; font-weight: bold; color: #fff; border: 1px solid rgba(255,255,255,0.3); }
        .hud-item .icon { margin-right: 6px; }
        #hpBar { color: #ff5252; }
        #ammoBar { color: #ffd700; }
        #moneyBar { color: #4caf50; }
        #lootBar { color: #2196f3; }
        #levelBar { color: #ff9800; }
        #xpBar { color: #9c27b0; }
        
        /* Контролы */
        #controls { position: fixed; bottom: 20px; left: 0; right: 0; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 20px; pointer-events: none; z-index: 10; }
        #joystick { width: 140px; height: 140px; background: rgba(255,255,255,0.15); border: 3px solid #fff; border-radius: 50%; position: relative; pointer-events: auto; box-shadow: 0 0 20px rgba(255,255,255,0.2); }
        #joystickKnob { width: 60px; height: 60px; background: #fff; border-radius: 50%; position: absolute; top: 40px; left: 40px; transition: transform 0.1s; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        #fireBtn { width: 90px; height: 90px; background: radial-gradient(circle, #ff5252, #d32f2f); border-radius: 50%; border: 3px solid #ffab91; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: bold; color: #fff; pointer-events: auto; box-shadow: 0 8px 20px rgba(255,82,82,0.4); }
        #fireBtn:active { transform: scale(0.9); }
        #menuBtn { position: fixed; bottom: 140px; right: 20px; background: #ffd700; border: none; border-radius: 50%; width: 60px; height: 60px; font-size: 30px; cursor: pointer; z-index: 20; box-shadow: 0 8px 20px rgba(255,215,0,0.4); }
        
        /* Миникарта и кнопка карты */
        #minimap { position: fixed; top: 70px; right: 10px; width: 140px; height: 140px; background: rgba(0,0,0,0.6); border-radius: 10px; border: 2px solid #444; z-index: 10; pointer-events: auto; cursor: pointer; }
        #mapModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; z-index: 100; }
        #mapCanvas { width: 90%; max-width: 500px; height: 90%; background: #1a1f2a; border-radius: 20px; border: 2px solid #ffd700; }
        
        /* Модалка магазина */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 50; }
        .modal-content { background: #1a1f2a; width: 92%; max-width: 420px; padding: 20px; border-radius: 20px; max-height: 85vh; overflow-y: auto; border: 2px solid #333; }
        .closeModal { position: absolute; top: 10px; right: 15px; font-size: 28px; cursor: pointer; color: #fff; background: none; border: none; }
        .tab { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab button { flex: 1; padding: 12px; background: #333; border: none; color: #fff; border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: bold; }
        .tab button.active { background: #ffd700; color: #111; }
        .item { background: #222; padding: 12px; margin: 8px 0; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #333; }
        .item button { background: #ffd700; border: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-weight: bold; color: #111; }
        .item button.sell { background: #f44336; color: #fff; }
        .rarity-common { border-left: 4px solid #b0bec5; }
        .rarity-rare { border-left: 4px solid #2196f3; }
        .rarity-epic { border-left: 4px solid #9c27b0; }
        .rarity-mythic { border-left: 4px solid #ff9800; }
        .rarity-legendary { border-left: 4px solid #ffd700; }
        
        #zoneWarning { position: fixed; top: 40%; left: 50%; transform: translate(-50%,-50%); color: #ff5252; font-size: 30px; font-weight: 900; text-shadow: 0 0 20px #ff5252; pointer-events: none; display: none; z-index: 100; }
        #extractBtn { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: #4caf50; padding: 15px 30px; border-radius: 30px; font-weight: bold; color: #fff; display: none; z-index: 50; cursor: pointer; box-shadow: 0 8px 20px rgba(76,175,80,0.5); }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="hud">
        <div class="hud-row">
            <div class="hud-item" id="hpBar"><span class="icon">❤️</span> 100</div>
            <div class="hud-item" id="ammoBar"><span class="icon">🔫</span> 30/120</div>
        </div>
        <div class="hud-row">
            <div class="hud-item" id="moneyBar"><span class="icon">💰</span> 0</div>
            <div class="hud-item" id="lootBar"><span class="icon">🎒</span> 0</div>
        </div>
        <div class="hud-row">
            <div class="hud-item" id="levelBar"><span class="icon">⭐</span> Уровень 1</div>
            <div class="hud-item" id="xpBar"><span class="icon">✨</span> 0/100</div>
        </div>
    </div>
    <canvas id="minimap" width="140" height="140" onclick="openMap()"></canvas>
    <div id="zoneWarning">⚠️ ВЫХОДИ ИЗ ЗОНЫ!</div>
    <div id="extractBtn" onclick="extract()">🏃 ВЫЙТИ</div>
    <button id="menuBtn" onclick="toggleShop()">🎒</button>
    <div id="controls">
        <div id="joystick"><div id="joystickKnob"></div></div>
        <button id="fireBtn">🔥</button>
    </div>
    
    <!-- Модалка карты -->
    <div id="mapModal">
        <canvas id="mapCanvas" width="500" height="500"></canvas>
        <button class="closeModal" onclick="closeMap()" style="position:absolute; top:20px; right:20px;">×</button>
    </div>
    
    <!-- Модалка магазина/инвентаря/заданий -->
    <div id="shopModal" class="modal">
        <div id="shopContent" class="modal-content">
            <button class="closeModal" onclick="toggleShop()">×</button>
            <h2 style="margin-bottom:20px; color:#ffd700;">🎒 Меню</h2>
            <div class="tab">
                <button onclick="switchTab('shop')" id="tabShop" class="active">Магазин</button>
                <button onclick="switchTab('inv')" id="tabInv">Инвентарь</button>
                <button onclick="switchTab('quests')" id="tabQuests">Задания</button>
            </div>
            <div id="shopItems"></div>
            <div id="invItems" style="display:none;"></div>
            <div id="questItems" style="display:none;"></div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
